services:
  - type: web
    name: win-professional-academy
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --no-input"
    preDeployCommand: "python manage.py migrate --no-input && python manage.py seed_academy_data"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 3 --threads 2 --timeout 120 config.wsgi:application"
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: win-academy-db
          property: connectionString
      # S3-Compatible Object Storage for persistent PDFs / study materials
      # (e.g. Cloudflare R2 - 10GB free tier, Backblaze B2, AWS S3)
      - key: USE_S3_STORAGE
        value: "False"
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET_NAME
        value: "win-academy-media"
      - key: STORAGE_REGION
        value: "auto"

databases:
  - name: win-academy-db
    plan: starter
    region: oregon
    databaseName: win_academy_db
    user: win_academy_user
